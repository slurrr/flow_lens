[adapters.bybit_spot]
type = "bybit_spot_ws"
symbols = [
  "BTC",
  "SOL",
]

[adapters.bybit_perp]
type = "bybit_perp_ws"
symbols = [
  "BTC",
  "SOL",
]

[sources.bybit_spot]
venue = "bybit"
instrument_class = "spot"
market_type_for_x = "spot"
price_eligible = true
price_priority = 70
has_size = true
has_aggressor = true
aggressor_mode = "native"
quote_mode = "usd_like"

[sources.bybit_perp]
venue = "bybit"
instrument_class = "perp"
market_type_for_x = "perp"
price_eligible = true
price_priority = 9
has_size = true
has_aggressor = true
aggressor_mode = "native"
quote_mode = "usd_like"

[runtime]
tbt_window_multiplier = 4.0
update_window_seconds = 1.0
price_selector_policy = "priority_sticky"
price_selector_stale_failover_ms = 6000
price_selector_recovery_confirm_cycles = 2
price_selector_switch_cooldown_cycles = 1

smoothing_dominance_alpha = 0.15
smoothing_effectiveness_alpha = 0.15

dispersion_metric = "hill"
halo_growth_rate = 0.10
halo_decay_rate = 0.5

binning_dot_size_thresholds = [0.35, 0.70]
binning_halo_thresholds = [0.33, 0.66]
binning_hysteresis_band = 0.05

tanh_k = 0.30

scale_window_seconds = 420.0

persist_enabled = true
persist_input = "y_gated"
persist_input_deadband = 0.0
persist_neutral_dir_abs_flash = 0.05
persist_neutral_dir_abs_persist = 0.08
persist_tau_eff_active = 12.0
persist_tau_dir_active = 14.0
persist_pivot_active_abs = 0.10
persist_pivot_confirm_s = 6.0
persist_pivot_neutralize_tau = 3.0
persist_pivot_neutral_zone_abs = 0.08
persist_rebuild_confirm_s = 4.0
persist_pivot_cooldown_s = 10.0
persist_pivot_max_s = 18.0
persist_max_delta_s_eff_per_second = 0.4
persist_tau_dir_pivot = 4.0
persist_dormant_quiet_abs = 0.04
persist_dormant_active_abs = 0.08
persist_dormant_quiet_s = 20.0
persist_tau_dormant = 45.0
persist_dormant_effort_norm_threshold = 0.35

disp_scale_multiplier = 0.10    # deadband 0.10
disp_scale_percentile = 0.80
disp_scale_min_samples = 20
disp_scale_floor_percentile = 0.0

effort_scale_percentile = 0.5
effort_scale_min_samples = 20
size_scale_percentile = 0.5

# ---- Dynamic X baseline (control context line) ----
control_baseline_enabled = true
control_baseline_target_window_s = 1800.0
control_baseline_target_update_s = 10.0
control_baseline_breakout_band = 0.06
control_baseline_confirm_s = 30.0
control_baseline_exit_band_frac = 0.50
control_baseline_peg_half_life_s = 7200.0
control_baseline_reanchor_half_life_s = 180.0
control_baseline_peg_deadband = 0.015
control_baseline_max_window_samples = 182
control_baseline_center_suppress_band = 0.02
control_baseline_line_hide_warmup_s = 120.0
control_baseline_midnight_tick_enabled = true
control_baseline_midnight_tick_min_samples = 60
control_baseline_midnight_tick_min_elapsed_s = 600.0

effort_floor_multiplier = 0.15    # 0.15
effort_floor_ticks = 60

# ---- TUI styling (Braille lens) ----
# Lens box size bounds in terminal cells (odd values center axes cleanly).
# Reasonable ranges: min 31-61, max 61-101 depending on terminal footprint.
tui_min_width = 41
tui_min_height = 17
tui_max_width = 81
tui_max_height = 33

# Dot radii for size bins [small, medium, large], in Braille pixels.
# Reasonable ranges: 0-6. Keep ascending.
tui_dot_radii = [1, 2, 4]

# Halo radii for halo bins [none, medium, large], in Braille pixels.
# Reasonable ranges: 0-14 depending on lens size. Keep ascending.
tui_halo_radii = [0, 6, 9]

# Circular frame controls.
tui_frame_enabled = true
tui_frame_inset_px = 0          # 0 touches edges; higher pulls inward
tui_frame_band_inner = 0.995    # smaller => thicker 0.995
tui_frame_band_outer = 1.01    # larger => thicker 1.005
tui_show_dev_panel = true

[runtime.hygiene]
enabled = true
max_excess_wire_lag_ms = 2000
hard_max_wire_lag_ms = 30000
wire_lag_baseline_window_s = 300
wire_lag_baseline_sample_interval_ms = 200
wire_lag_baseline_min_samples = 30
wire_lag_baseline_max_samples = 2000
dedupe_ttl_s = 30
log_interval_s = 10
future_venue_ts_grace_ms = 250
connect_gate_s = 0
connect_gate_max_excess_wire_lag_ms = 500
connect_gate_hard_max_wire_lag_ms = 5000
connect_gate_rearm_after_s = 60

[runtime.dist_state]
enabled = false
symbol = "BTC"
source_id = "binance_perp"
timeframes = ["3m", "15m", "1h", "4h"]
warmup_kline_bars = 200
warmup_oi_hist_points = 200
ready_core_min_bars = 30
ready_p_min_deltas = 10
p_availability_mode = "strict"
oi_poll_interval_ms = 1000
oi_tolerance_ms = 7000
oi_time_missing_policy = "reject"
oi_verify_enabled = true
oi_verify_timeframes = ["3m", "15m", "1h", "4h"]
oi_verify_timeout_ms = 1200
oi_verify_max_rate_per_min = 24
oi_quality_window_ms = 15000
oi_seed_points = 200
oi_seed_min_points = 30
v_scale_window_bars = 200
v_scale_percentile = 0.80
v_scale_min_samples = 30
hl_vol_bars = 20.0
hl_stretch_bars = 20.0
hl_oi_bars = 20.0
hl_atr_short_bars = 10.0
hl_atr_long_bars = 40.0
hl_a_bars = 20.0
k_s = 0.6
k_p = 0.6
k_t = 1.0
tokens_enabled = false
tokens_fail_fast_unknown = true
s_dir_deadband = 0.10
s_ext_enter = 0.60
s_ext_exit = 0.45
s_revert_min_stretch = 0.20
t_exp_enter = 0.40
t_exp_exit = 0.25
t_comp_enter = -0.40
t_comp_exit = -0.25
a_cont_enter = 0.35
a_cont_exit = 0.20
a_revert_enter = -0.35
a_revert_exit = -0.20
v_low_threshold = 0.25
t_rise_threshold = 0.05
s_neut_max = 0.12
a_neut_max = 0.12
t_neut_max = 0.12
v_neut_min = 0.30
v_neut_max = 0.70
t_exp_plus = 0.60
t_exp_plus_plus = 0.80
t_comp_plus = -0.60
t_comp_plus_plus = -0.80
a_cont_plus = 0.55
a_cont_plus_plus = 0.75
a_revert_plus = -0.55
a_revert_plus_plus = -0.75
s_exh_plus = 0.70
s_exh_plus_plus = 0.85
p_confirm_threshold = 0.20
token_min_hold_bars_3m = 2
token_min_hold_bars_15m = 2
token_min_hold_bars_1h = 1
token_min_hold_bars_4h = 1
narrative_enabled = false
narrative_driver_tf = "15m"
narrative_linger_reminder_closes = 0
narrative_max_chars = 72
narrative_secondary_min_ratio = 0.50
narrative_dir_ratio_min = 0.20
