[adapters.binance_spot]
type = "binance_spot_ws"
symbols = [
  "BTC",
]

[adapters.binance_perp]
type = "binance_perp_ws"
symbols = [
  "BTC",
]

[adapters.coinbase_spot]
type = "coinbase_spot_ws"
symbols = [
  "BTC",
]

[sources.binance_spot]
venue = "binance"
instrument_class = "spot"
market_type_for_x = "spot"
price_eligible = true
price_priority = 100
has_size = true
has_aggressor = true
aggressor_mode = "native"
quote_mode = "converted"

[sources.binance_perp]
venue = "binance"
instrument_class = "perp"
market_type_for_x = "perp"
price_eligible = true
price_priority = 10
has_size = true
has_aggressor = true
aggressor_mode = "native"
quote_mode = "usd_like"

[sources.coinbase_spot]
venue = "coinbase"
instrument_class = "spot"
market_type_for_x = "spot"
price_eligible = true
price_priority = 90
has_size = true
has_aggressor = true
aggressor_mode = "native"
quote_mode = "usd_like"

[runtime]
tbt_window_multiplier = 4.0
update_window_seconds = 0.69

price_selector_policy = "priority_sticky"
price_selector_stale_failover_ms = 6000
price_selector_recovery_confirm_cycles = 2
price_selector_switch_cooldown_cycles = 1

smoothing_dominance_alpha = 0.12        # 0.15
smoothing_effectiveness_alpha = 0.1    # 0.15

dispersion_metric = "hill"
halo_growth_rate = 0.10
halo_decay_rate = 0.5

binning_dot_size_thresholds = [0.35, 0.70]
binning_halo_thresholds = [0.33, 0.66]
binning_hysteresis_band = 0.05

tanh_k = 0.38

scale_window_seconds = 300.0

persist_enabled = true
persist_input = "y_gated"
persist_input_deadband = 0.0
persist_neutral_dir_abs_flash = 0.05
persist_neutral_dir_abs_persist = 0.08
persist_tau_eff_active = 10.0
persist_tau_dir_active = 12.0
persist_pivot_active_abs = 0.10
persist_pivot_confirm_s = 4.0
persist_pivot_neutralize_tau = 3.0
persist_pivot_neutral_zone_abs = 0.08
persist_rebuild_confirm_s = 3.0
persist_pivot_cooldown_s = 8.0
persist_pivot_max_s = 18.0
persist_max_delta_s_eff_per_second = 0.5
persist_tau_dir_pivot = 4.0
persist_dormant_quiet_abs = 0.04
persist_dormant_active_abs = 0.08
persist_dormant_quiet_s = 20.0
persist_tau_dormant = 45.0
persist_dormant_effort_norm_threshold = 0.35

disp_scale_multiplier = 0.12    # deadband 0.10
disp_scale_percentile = 0.80
disp_scale_min_samples = 20
disp_scale_floor_percentile = 0.0

effort_scale_percentile = 0.45
effort_scale_min_samples = 20
size_scale_percentile = 0.45

effort_floor_multiplier = 0.15    # 0.15
effort_floor_ticks = 45

# ---- TUI styling (Braille lens) ----
# Lens box size bounds in terminal cells (odd values center axes cleanly).
# Reasonable ranges: min 31-61, max 61-101 depending on terminal footprint.
tui_min_width = 41
tui_min_height = 17
tui_max_width = 81
tui_max_height = 33

# Dot radii for size bins [small, medium, large], in Braille pixels.
# Reasonable ranges: 0-6. Keep ascending.
tui_dot_radii = [1, 2, 4]

# Halo radii for halo bins [none, medium, large], in Braille pixels.
# Reasonable ranges: 0-14 depending on lens size. Keep ascending.
tui_halo_radii = [0, 6, 9]

# Circular frame controls.
tui_frame_enabled = true
tui_frame_inset_px = 0          # 0 touches edges; higher pulls inward
tui_frame_band_inner = 0.995    # smaller => thicker 0.995
tui_frame_band_outer = 1.01    # larger => thicker 1.005
